[workspace]
resolver = "2"
members = [
    "crates/browser",
    "crates/browser-core",
    "crates/browser-network",
    "crates/browser-privacy",
    "crates/browser-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MPL-2.0"
repository = ""
authors = ["Rust Browser Developers"]

[workspace.dependencies]
browser-core = { path = "crates/browser-core" }
browser-network = { path = "crates/browser-network" }
browser-privacy = { path = "crates/browser-privacy" }
browser-security = { path = "crates/browser-security" }

dpi = "0.1.2"
egui = "0.36"
egui_glow = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
env_logger = "0.11"
image = "0.25"
log = "0.4"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
servo = { version = "0.5.0", features = ["no-wgl"] }
surfman = { version = "0.13", features = ["sm-raw-window-handle-06"] }
thiserror = "2"
url = "2.5"
winit = "0.30"

[profile.release]
# Deliberately conservative: optimizations are benchmarked in Phase 15
# (see PERFORMANCE.md) before tightening (lto, codegen-units, panic=abort).
opt-level = 3
